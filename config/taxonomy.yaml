categories:
  C0:
    name: "Measurement & Tracking"
    zh: "测量与追踪"
    scope: "显微图像到谱系分辨细胞对象：nucleus/membrane segmentation、cell tracking、division detection、lineage reconstruction、tracking benchmark"
  C1:
    name: "Cell & Embryo Representation"
    zh: "细胞与胚胎表示"
    scope: "胚胎环境中的细胞表示学习；identity-blind/time-shuffle 消融；equivariant/invariant 坐标；多模态对齐"
  C2:
    name: "WT Developmental Dynamics"
    zh: "野生型发育动力学"
    scope: "发育轨迹建模、cell position variability、canalization、developmental robustness、cell-cycle timing"
  C3:
    name: "Morphology & Mechanics"
    zh: "形态与力学"
    scope: "3D 形态图谱、接触面积/曲率/tricellular junction、force inference（FIDES/foam/phase-field）、可微形态发生模拟器、eggshell confinement"
  C4:
    name: "Molecular Regulation & Coupling"
    zh: "分子调控与耦合"
    scope: "lineage-resolved scRNA、TF reporter atlas、RNA-protein 时滞、Wnt/Notch 信号、基因调控网络、分子-力学耦合"
  C5:
    name: "Perturbation & Causal Inference"
    zh: "扰动与因果推断"
    scope: "RNAi/突变/激光消融/机械压缩扰动实验；扰动响应预测；counterfactual；扰动沿谱系/接触网络传播"
  C6:
    name: "Fate Specification & Lineage Biology"
    zh: "命运决定与谱系生物学"
    scope: "谱系生物学、母源因子、非对称分裂、命运决定机制（含经典奠基文献）"
  C7:
    name: "Methods Transfer"
    zh: "方法迁移"
    scope: "非线虫系统但方法可迁移：graph neural dynamics、neural ODE/SDE、物理信息机器学习、单细胞/发育基础模型。占比软上限 30%"
  C8:
    name: "Datasets, Benchmarks & Software"
    zh: "数据集、基准与软件"
    scope: "公开数据集、benchmark、tracking/segmentation 工具、图谱资源"
  C9:
    name: "Reviews & Perspectives"
    zh: "综述与观点"
    scope: "综述、观点、路线图"

modality_tags: [imaging, scRNA, protein-reporter, morphology-3D, mechanics, lineage, perturbation, theory-model]
species_tags: [c-elegans, c-briggsae, other-species]

evidence_levels:
  peer-reviewed: "正式同行评审发表"
  preprint: "bioRxiv/medRxiv/arXiv 预印本"
  emerging-evidence: "未经同行评审或独立验证、但方向重要；引用时必须显式标注其证据状态"

standards_tags:
  embryo-level-split: "训练/验证/测试按整枚胚胎切分"
  open-loop-rollout: "报告多步自由 rollout（非仅 teacher forcing）"
  uncertainty-quantified: "给出不确定性量化/校准"
  perturbation-holdout: "扰动按 gene/condition 整体留出"
  shortcut-audit: "进行 ID/time/coordinate 捷径审计"

relevance_tiers:
  T1-core: "直接关于 C. elegans 胚胎发育的测量、动力学、分子或扰动"
  T2-adjacent: "线虫其他阶段/组织，或直接相关的通用方法"
  T3-transfer: "其他物种/纯方法论，有明确迁移价值"
